[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titanium"
version = "0.2.0.dev0"
description = "A desktop workbench for building, running and honestly judging trading strategies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
titanium = "titanium.desktop.app:main"

[tool.setuptools.packages.find]
include = ["titanium*"]

[tool.setuptools.package-data]
"titanium.desktop" = ["assets/*.png", "assets/*.svg", "design/packs/*.toml"]
"titanium.plugins" = ["builtin/*/*.json", "builtin/*/*.py", "builtin/*/*.md", "builtin/*/tests/*.py",
                      "builtin/*/skins/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "titanium/plugins/builtin"]
