name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]  # the app's build, and the newest Python people install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1
      - run: pip install -e ".[dev]"
      - run: QT_QPA_PLATFORM=offscreen pytest -q
      - run: QT_QPA_PLATFORM=offscreen python tools/screenshots.py screenshots
        if: matrix.python == '3.12'
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: screenshots
          path: screenshots/
