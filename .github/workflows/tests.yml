name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[web,dev,desktop]"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - run: pytest -q
