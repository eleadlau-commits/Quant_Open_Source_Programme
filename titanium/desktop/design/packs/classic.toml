# Classic: the first Titanium look. Warm neutral greys, the logo's red as the
# brand accent, solid blue for actions. Every other built-in skin extends it.
id = "classic"
name = "Classic"
description = "Soft warm cards with solid blue actions. The original Titanium look."

[shape]
radius = { sm = 4, md = 6, lg = 8, xl = 12 }

[fonts]
ui = ["Inter", "Segoe UI Variable Text", "Segoe UI", "SF Pro Text", "Helvetica Neue", "Arial"]
mono = ["JetBrains Mono", "Cascadia Code", "SF Mono", "Menlo", "Consolas", "DejaVu Sans Mono"]

[effects]
panel_gradient = false
top_highlight = false
glow = 0.0
canvas = "none"
nav_marker = "tile"
primary = "fill"
run = "fill"
numbers = "ui"

[light]
window = "#f3f3f1"
surface = "#ffffff"
surface_alt = "#f7f7f5"
sunken = "#f0f0ed"
nav = "#ebebe7"
border = "#e3e3de"
border_strong = "#c8c8c3"
text = "#1d1d1b"
text_muted = "#6b6b66"
text_faint = "#9a9a94"
ink = "#111418"
ink_hover = "#2a2f37"
on_ink = "#f6f6f3"
brand = "#b4635e"
brand_soft = "#f4e6e5"
primary = "#2f5bd3"
primary_hover = "#264cb5"
primary_soft = "#e6ecfb"
on_primary = "#ffffff"
success = "#1f8a4c"
warning = "#b7791f"
danger = "#c0392b"
series = ["#2f5bd3", "#b4635e", "#1f8a4c", "#b7791f", "#7b3fb0", "#2a8c9a"]
surface_top = "#ffffff"
highlight = "#ffffff"
glow = "#b4635e"
accent_2 = "#b7791f"
# code editor (syntax colours; code_knob is the background of knob(...) calls)
code_keyword = "#7b3fb0"
code_function = "#2f5bd3"
code_string = "#1f8a4c"
code_number = "#b7791f"
code_comment = "#9a9a94"
code_decorator = "#6b6b66"
code_knob = "#f1dcda"

[dark]
window = "#1b1b1a"
surface = "#232321"
surface_alt = "#2a2a28"
sunken = "#181817"
nav = "#151514"
border = "#30302d"
border_strong = "#45453f"
text = "#e8e8e3"
text_muted = "#a3a39c"
text_faint = "#6f6f69"
ink = "#f1f1ec"
ink_hover = "#d6d6d0"
on_ink = "#151514"
brand = "#d08a84"
brand_soft = "#3a2726"
primary = "#4a7cf0"
primary_hover = "#6690f5"
primary_soft = "#1f2a44"
on_primary = "#ffffff"
success = "#4cc27e"
warning = "#e0b062"
danger = "#ff6b5e"
series = ["#6690f5", "#d08a84", "#4cc27e", "#e0b062", "#b38cf0", "#5cc3d1"]
surface_top = "#232321"
highlight = "#30302d"
glow = "#d08a84"
accent_2 = "#e0b062"
# code editor (syntax colours; code_knob is the background of knob(...) calls)
code_keyword = "#b38cf0"
code_function = "#6690f5"
code_string = "#4cc27e"
code_number = "#e0b062"
code_comment = "#6f6f69"
code_decorator = "#a3a39c"
code_knob = "#3a2726"
