# Graphite: a cockpit. Dark-first layered graphite panels that catch a light edge,
# the logo's red as a soft "live" glow, and no blue fills. The light theme is
# brushed aluminium. Blue is kept only for focus and selection.
id = "graphite"
name = "Graphite"
description = "Layered graphite panels with a red signal glow. Aluminium in light mode."
extends = "classic"

[shape]
radius = { sm = 4, md = 6, lg = 8, xl = 12 }

[fonts]
# Inter and JetBrains Mono, as in Classic (inherited).

[effects]
panel_gradient = true
top_highlight = true
glow = 0.55
canvas = "dots"
nav_marker = "dot"
primary = "edge"
run = "capsule"
numbers = "mono"

[light]
window = "#e9e9e6"
surface = "#f6f6f3"
surface_top = "#fdfdfc"
surface_alt = "#efefec"
sunken = "#e2e2de"
nav = "#dfdfdb"
border = "#d2d2cc"
border_strong = "#b9b9b2"
text = "#121214"
text_muted = "#5e5e5a"
text_faint = "#8a8a84"
ink = "#121214"
ink_hover = "#2a2b2f"
on_ink = "#f6f6f3"
brand = "#b4635e"
brand_soft = "#f1e2e0"
accent_2 = "#c48a45"
primary = "#3d5fa8"
primary_hover = "#334f8d"
primary_soft = "#dfe5f1"
on_primary = "#ffffff"
success = "#23804c"
warning = "#b7791f"
danger = "#b8392d"
series = ["#b4635e", "#3d5fa8", "#23804c", "#b7791f", "#7b3fb0", "#2a8c9a"]
highlight = "#ffffffe6"
glow = "#b4635e"

[dark]
window = "#0f1011"
surface = "#161719"
surface_top = "#1d1e21"
surface_alt = "#1f2023"
sunken = "#0b0b0c"
nav = "#0b0c0d"
border = "#26272a"
border_strong = "#3a3b3f"
text = "#eceae6"
text_muted = "#9a9893"
text_faint = "#6a6964"
ink = "#eceae6"
ink_hover = "#d6d4cf"
on_ink = "#0f1011"
brand = "#e0837c"
brand_soft = "#3a2422"
accent_2 = "#d9a066"
primary = "#7d9fe0"
primary_hover = "#98b3e8"
primary_soft = "#1b2333"
on_primary = "#0f1011"
success = "#58c88a"
warning = "#e3b062"
danger = "#ff7a6c"
series = ["#e0837c", "#8fa9d9", "#58c88a", "#e3b062", "#b79cf0", "#5cc3d1"]
highlight = "#ffffff12"
glow = "#e0837c"
